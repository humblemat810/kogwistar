name: PyPI Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version in pyproject.toml and tag v<version>
        required: true
        type: string
      publish:
        description: Publish with PyPI Trusted Publishing after all artifact checks
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Verify tag, package version, and PyPI availability
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="$INPUT_VERSION"
          fi
          export RELEASE_VERSION
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen

          version = os.environ["RELEASE_VERSION"]
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          expected = f'version = "{version}"'
          if expected not in text:
              raise SystemExit(f"pyproject.toml must contain {expected!r}")
          try:
              with urlopen("https://pypi.org/pypi/kogwistar/json", timeout=20) as response:
                  releases = json.load(response).get("releases", {})
          except HTTPError as error:
              if error.code != 404:
                  raise
              releases = {}
          if version in releases:
              raise SystemExit(f"kogwistar {version} already exists on PyPI")
          print(f"version={version}")
          PY
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  wheels:
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheel-linux-x86_64
          - os: windows-latest
            artifact: wheel-windows-x86_64
          - os: macos-15-intel
            artifact: wheel-macos-x86_64
          - os: macos-15
            artifact: wheel-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Build native wheel
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --locked --out dist

      - name: Install and smoke native wheel
        run: python scripts/native_wheel_contract_smoke.py --wheelhouse dist

      - name: Upload tested wheel
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Build source distribution with Maturin
        run: |
          python -m pip install --upgrade pip maturin twine
          python -m maturin sdist --out dist
          python -m twine check dist/*

      - name: Reject sensitive or generated source-distribution files
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as tar_open

          blocked = (".codex", ".env", ".sqlite", ".db", ".log", ".pem", ".key", ".pfx", ".p12", ".crt", ".cer")
          for archive in Path("dist").glob("*.tar.gz"):
              names = tar_open(archive).getnames()
              rejected = [name for name in names if any(value in name.lower() for value in blocked)]
              if rejected:
                  raise SystemExit(f"{archive}: forbidden files: {rejected}")
          PY

      - name: Rebuild the source distribution through standard PEP 517
        run: |
          mkdir source-build
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir source-build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("source-build").glob("*.whl"))
          names = ZipFile(wheel).namelist()
          if not any(name.startswith("kogwistar/_rust") for name in names):
              raise SystemExit(f"{wheel} does not contain the native extension")
          print(wheel.name)
          PY

      - name: Upload audited source distribution
        uses: actions/upload-artifact@v6
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  pypy-wheel:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: pypy-3.11-v7.3.20
          cache: pip
          cache-dependency-path: requirements-pypy-3.11-experimental.txt

      - name: Build and smoke-test pure-Python PyPy wheel
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel packaging
          python setup.py bdist_wheel --dist-dir dist
          wheel="$(find dist -maxdepth 1 -name 'kogwistar-*-py3-none-any.whl' -print -quit)"
          test -n "$wheel"
          python - "$wheel" <<'PY'
          import sys
          from email.parser import Parser
          from zipfile import ZipFile

          from packaging.utils import parse_wheel_filename

          wheel = sys.argv[1]
          _, version, _, tags = parse_wheel_filename(wheel)
          if not any(str(tag) == "py3-none-any" for tag in tags):
              raise SystemExit(f"expected a pure Python wheel, got {tags}")
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(archive.read(metadata_name).decode())
          native_modules = [
              name for name in names
              if name.startswith("kogwistar/_rust.")
              or name.endswith((".so", ".pyd", ".dll", ".dylib"))
          ]
          if native_modules:
              raise SystemExit(f"pure Python wheel contains native modules: {native_modules}")
          if metadata["Version"] != str(version):
              raise SystemExit("wheel filename and METADATA versions differ")
          if metadata["Requires-Python"] != ">=3.11":
              raise SystemExit(f"unexpected Requires-Python: {metadata['Requires-Python']}")
          print(f"wheel={wheel} version={version} requires-python={metadata['Requires-Python']}")
          PY
          python -m pip install "$wheel"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/pypy311_pure_wheel_smoke.py" \
            --expected-version "$EXPECTED_VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: wheel-pypy311-pure
          path: dist/*.whl
          if-no-files-found: error

  audit-artifacts:
    needs: [wheels, sdist, pypy-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download every tested release artifact
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Validate the exact publish set
        run: |
          python -m pip install --upgrade pip twine packaging
          python -m twine check dist/*
          python scripts/audit_pypi_release_artifacts.py \
            --dist dist \
            --expected-version "${{ needs.verify-release.outputs.version }}"
          find dist -maxdepth 1 -type f -printf '%f\n' | sort

  publish:
    needs: [verify-release, audit-artifacts]
    # Version tags are the normal release path. The manual input remains useful
    # for a deliberately controlled rerun from a tag.
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kogwistar
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download all tested artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Final artifact validation
        run: |
          python -m pip install --upgrade pip twine packaging
          python -m twine check dist/*
          python scripts/audit_pypi_release_artifacts.py \
            --dist dist \
            --expected-version "${{ needs.verify-release.outputs.version }}"
          find dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish to PyPI through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
