name: PyPI Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in pyproject.toml and tag v<version>
        required: true
        type: string
      publish:
        description: Publish with PyPI Trusted Publishing after all artifact checks
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Verify tag, package version, and PyPI availability
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen

          version = os.environ["RELEASE_VERSION"]
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          expected = f'version = "{version}"'
          if expected not in text:
              raise SystemExit(f"pyproject.toml must contain {expected!r}")
          try:
              with urlopen("https://pypi.org/pypi/kogwistar/json", timeout=20) as response:
                  releases = json.load(response).get("releases", {})
          except HTTPError as error:
              if error.code != 404:
                  raise
              releases = {}
          if version in releases:
              raise SystemExit(f"kogwistar {version} already exists on PyPI")
          print(f"version={version}")
          PY
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  wheels:
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheel-linux-x86_64
          - os: windows-latest
            artifact: wheel-windows-x86_64
          - os: macos-13
            artifact: wheel-macos-x86_64
          - os: macos-14
            artifact: wheel-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1

      - name: Build native wheel
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --locked --out dist

      - name: Install and smoke native wheel
        run: python scripts/adr015_native_wheel_smoke.py --wheelhouse dist

      - name: Upload tested wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1

      - name: Build source distribution with Maturin
        run: |
          python -m pip install --upgrade pip maturin twine
          python -m maturin sdist --out dist
          python -m twine check dist/*

      - name: Reject sensitive or generated source-distribution files
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as tar_open

          blocked = (".codex", ".env", ".sqlite", ".db", ".log", ".pem", ".key", ".pfx", ".p12", ".crt", ".cer")
          for archive in Path("dist").glob("*.tar.gz"):
              names = tar_open(archive).getnames()
              rejected = [name for name in names if any(value in name.lower() for value in blocked)]
              if rejected:
                  raise SystemExit(f"{archive}: forbidden files: {rejected}")
          PY

      - name: Rebuild the source distribution through standard PEP 517
        run: |
          mkdir source-build
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir source-build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("source-build").glob("*.whl"))
          names = ZipFile(wheel).namelist()
          if not any(name.startswith("kogwistar/_rust") for name in names):
              raise SystemExit(f"{wheel} does not contain the native extension")
          print(wheel.name)
          PY

      - name: Upload audited source distribution
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  audit-artifacts:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download every tested release artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Validate the exact publish set
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
          find dist -maxdepth 1 -type f -printf '%f\n' | sort

  publish:
    needs: [verify-release, audit-artifacts]
    if: inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kogwistar
    permissions:
      id-token: write
    steps:
      - name: Download all tested artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Final artifact validation
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
          find dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish to PyPI through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
