name: Experimental PyPy 3.11 Python authority

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypy-311:
    name: PyPy 3.11 core Python-authority probe
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up official PyPy 3.11
        uses: actions/setup-python@v7
        with:
          python-version: pypy-3.11-v7.3.20
          cache: pip

      - name: Verify interpreter and install bounded dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.implementation.name == "pypy"; assert sys.version_info[:2] == (3, 11); print(sys.implementation); print(sys.version)'
          python -m pip install -r requirements-pypy-3.11-experimental.txt

      - name: Run Python-authority contract tests
        shell: bash
        env:
          KOGWISTAR_IMPL_MODE: python
        run: >-
          python -m pytest
          tests/core/test_pypy_ci_contract.py
          tests/core/test_high_cardinality_layout.py
          -m "ci and not ci_full and not slow and not manual and not llm_real and not requires_ollama"
          -q --durations=25 --durations-min=0 -p no:cacheprovider

      - name: Report native boundary
        run: |
          echo "PyPy 3.11 Python-authority probe completed."
          echo "Native extension compatibility remains covered by the separate ABI gate; no image is published here."
