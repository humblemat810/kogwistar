[pytest]
addopts = -p no:tmpdir -p no:cacheprovider
cache_dir = .pytest-local-cache
pythonpath = .
norecursedirs =
    .git
    .venv
    .pytest_cache
    .pytest*
    pytest-cache-files-*
    .tmp_*
    .tmp_build
    .tmp_pip
    .tmp_pytest
    pytest_tmp*
    tmp_pytest*
    .codex_tmp*
    .codex
    manual_tmp*
    tmp_manual*
    tmp_verify*
    tests/_artifacts
    build
    dist
    .cache
markers =
    ci: required on pull-request CI
    ci_full: required on full CI (post-merge / broader matrix)
    regression: regression coverage for changed or previously failing behavior
    slow: intentionally slow tests excluded from feature and regression profiles
    nightly: nightly-only coverage
    core: engine/core graph capabilities
    workflow: workflow runtime and orchestration
    conversation: conversation orchestration and resolvers
    runtime: runtime engine and parity suites
    runtime_async: async runtime contracts
    runtime_sync: sync runtime contracts
    runtime_bridge_parity: bridge parity contract
    server: server-layer tests
    unit: no external systems, deterministic fast tests
    integration: multi-component integration tests
    e2e: end-to-end behavior tests across major components
    llm_real: tests requiring non-fake LLM behavior or external LLM credentials
    requires_ollama: tests requiring a live local Ollama service or model
    requires_rust: tests that require the built kogwistar native extension
    requires_langgraph: tests that require the optional LangGraph dependency
    requires_pgvector: tests that require the optional pgvector dependency
    manual: manually triggered tests only

log_cli = true
log_cli_level = INFO
log_level = DEBUG    
