[package]
name = 'kogwistar_store_graph'
version = '0.1.0'
edition = '2021'

[lib]
name = 'kogwistar_graph'
crate-type = ['cdylib']

[dependencies]
pyo3 = { version = '0.29', features = ['abi3', 'auto-initialize'] }
serde = { version = '1.0', features = ['derive'] }
serde_json = '1.0'
postgres = { version = '0.19', features = ['with-serde_json-1'] }
sha2 = '0.11'
uuid = { version = '1.0', features = ['v4', 'v5'] }
once_cell = '1'
pgvector = '0.2'

[profile.release]
opt-level = 2
