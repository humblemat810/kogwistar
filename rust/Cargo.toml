[workspace]
members = [
    "crates/kogwistar-contracts",
    "crates/kogwistar-engine",
    "crates/kogwistar-api",
    "crates/kogwistar-python",
    "crates/kogwistar-runtime",
    "crates/kogwistar-store",
    "crates/kogwistar-store-memory",
    "crates/kogwistar-store-sqlite",
    "crates/kogwistar-store-postgres",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
hex = "0.4"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py312", "generate-import-lib"] }
proptest = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tokio-postgres = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }
